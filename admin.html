<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel - Party Paradise</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      padding: 30px 20px;
      color: #fff;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(102,126,234,0.2); }
      50%      { box-shadow: 0 0 40px rgba(102,126,234,0.4); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1400px;
      margin: auto;
      animation: fadeInUp 0.8s ease-out;
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px 25px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeInUp 0.8s ease-out;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 600;
      background: linear-gradient(135deg, #a8b8ff, #d4a5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header h1 span {
      font-size: 28px;
      margin-right: 8px;
    }

    .logout-btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .logout-btn:active {
      transform: scale(0.95);
    }

    /* ===== SECTION TITLE ===== */
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeInUp 0.8s ease-out 0.1s both;
    }

    .section-title h2 {
      font-size: 20px;
      font-weight: 500;
      color: #e0e0ff;
    }

    .section-title .badge {
      background: rgba(102,126,234,0.3);
      color: #a8b8ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    /* ===== SEARCH ===== */
    .search-wrapper {
      position: relative;
      margin-bottom: 25px;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .search-wrapper .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #8888aa;
      font-size: 16px;
      pointer-events: none;
    }

    .search-box {
      width: 100%;
      padding: 14px 16px 14px 45px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .search-box::placeholder {
      color: #8888aa;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 0 0 4px rgba(102,126,234,0.15), 0 8px 30px rgba(0,0,0,0.2);
    }

    /* ===== TABLE ===== */
    .table-wrapper {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: rgba(102,126,234,0.2);
      color: #a8b8ff;
      padding: 16px 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    tbody td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 14px;
      color: #d0d0e8;
      transition: all 0.3s ease;
    }

    tbody tr {
      animation: fadeInUp 0.5s ease-out both;
      transition: all 0.3s ease;
    }

    tbody tr:hover {
      background: rgba(102,126,234,0.1);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .message-cell {
      max-width: 300px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #b0b0cc;
      font-size: 13px;
    }

    /* ===== BUTTONS ===== */
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
    }

    .action-btn:hover {
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .action-btn:active {
      transform: scale(0.9);
    }

    .call-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); }
    .mail-btn { background: linear-gradient(135deg, #3498db, #2980b9); }
    .wa-btn   { background: linear-gradient(135deg, #25d366, #1da851); }

    .delete-btn {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      transform: translateY(-3px) scale(1.1);
      box-shadow: 0 8px 20px rgba(231,76,60,0.4);
    }

    .delete-btn:active {
      transform: scale(0.9);
    }

    .view-btn {
      background: rgba(102,126,234,0.2);
      color: #a8b8ff;
      border: 1px solid rgba(102,126,234,0.3);
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      font-size: 11px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
    }

    .view-btn:hover {
      background: rgba(102,126,234,0.4);
      transform: translateY(-1px);
    }

    /* ===== LOADING ===== */
    .loading-row td {
      height: 60px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite linear;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8888aa;
      font-size: 16px;
    }

    .empty-state .emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 15px;
      animation: float 3s ease-in-out infinite;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        min-width: 700px;
      }
    }
  </style>

  <script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
      window.location.href = "admin-login.html";
    }

    const API_BASE = "https://party-paradise-apggecgjd3hcaaes.centralindia-01.azurewebsites.net/api";

    function logout() {
      localStorage.removeItem("adminLoggedIn");
      window.location.href = "admin-login.html";
    }
  </script>
</head>

<body>
<div class="container">

  <div class="header">
    <h1><span>🎉</span> Admin Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="section-title">
    <h2>📩 Contact Messages</h2>
    <span class="badge" id="countBadge">0</span>
  </div>

  <div class="search-wrapper">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="searchInput"
      class="search-box"
      placeholder="Search by name, email, phone or message..."
      onkeyup="filterContacts()"
    />
  </div>

  <div class="table-wrapper">
    <table id="contactTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Message</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
/* ---------- LOAD CONTACTS ---------- */
async function loadContacts() {
  const tbody = document.querySelector("#contactTable tbody");

  // Show loading shimmer
  tbody.innerHTML = `
    <tr class="loading-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="loading-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="loading-row"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
  `;

  const res = await fetch(`${API_BASE}/contact`);
  const data = await res.json();
  tbody.innerHTML = "";

  // Update count badge
  document.getElementById("countBadge").textContent = data.length;

  if (data.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="empty-state">
          <span class="emoji">📭</span>
          No messages yet
        </td>
      </tr>
    `;
    return;
  }

  data.forEach((c, index) => {
    const row = document.createElement("tr");
    row.style.animationDelay = `${index * 0.05}s`;
    row.innerHTML = `
      <td>${c.name}</td>
      <td>${c.email}</td>
      <td>${c.phone}</td>
      <td class="message-cell">
        ${c.message.substring(0, 60)}${c.message.length > 60 ? "..." : ""}
        <br>
        <button class="view-btn" onclick="alert(\`${c.message}\`)">View</button>
      </td>
      <td>${new Date(c.createdAt).toLocaleString()}</td>
      <td>
        <div class="btn-group">
          <button class="action-btn call-btn" onclick="callCustomer('${c.phone}')" title="Call">📞</button>
          <button class="action-btn mail-btn" onclick="mailCustomer('${c.email}')" title="Email">📧</button>
          <button class="action-btn wa-btn" onclick="whatsappCustomer('${c.phone}')" title="WhatsApp">💬</button>
          <button class="delete-btn" onclick="deleteContact('${c._id}')" title="Delete">🗑️</button>
        </div>
      </td>
    `;
    tbody.appendChild(row);
  });
}

/* ---------- SEARCH FILTER ---------- */
function filterContacts() {
  const value = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#contactTable tbody tr");

  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(value)
      ? ""
      : "none";
  });
}

/* ---------- QUICK ACTION FUNCTIONS ---------- */
function callCustomer(phone) {
  window.open(`tel:${phone}`);
}

function mailCustomer(email) {
  window.open(`mailto:${email}`);
}

function whatsappCustomer(phone) {
  const num = phone.replace(/\D/g, "");
  window.open(`https://wa.me/91${num}`, "_blank");
}

/* ---------- DELETE ---------- */
async function deleteContact(id) {
  if (!confirm("Delete this message?")) return;
  await fetch(`${API_BASE}/contact/${id}`, { method: "DELETE" });
  loadContacts();
}

loadContacts();
</script>

</body>
</html>
